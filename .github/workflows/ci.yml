name: CI

on:
  push:
    branches: [main, zhou]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Vet
        run: go vet ./...
      - name: Test (race + cover)
        run: |
          set -o pipefail
          go test -race -cover ./... 2>&1 | tee test.log
      - name: Publish failure details
        if: failure()
        run: |
          {
            echo "## CI 失败详情"
            grep -E -- "--- FAIL|FAIL|panic:|WARNING: DATA RACE|ok  " test.log || true
          } >> "$GITHUB_STEP_SUMMARY"
